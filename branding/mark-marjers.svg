<?xml version="1.0" encoding="UTF-8"?>
<!--
  The mark as drawn on marjers.com/portfolio for the BlockBuilder Studio
  card. Three isometric cubes staggered diagonally with a smaller accent
  cube on top, single-colour line work. The accent cube has a faint fill
  on its top face for a subtle depth hint.
  Original source: PlatformGlyphBlocks in josedasilva11/portfoliov2.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="mj-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#cdff45"/>
      <stop offset="100%" stop-color="#7cbe1e"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#mj-grad)" stroke-width="1.6"
     stroke-linejoin="round" stroke-linecap="round">
    <!-- Bottom-back cube -->
    <path d="M14 22 L26 16 L38 22 L26 28 Z"/>
    <path d="M14 22 L14 36 L26 42 L26 28"/>
    <path d="M38 22 L38 36 L26 42"/>
    <!-- Top-front cube -->
    <path d="M28 30 L40 24 L52 30 L40 36 Z"/>
    <path d="M28 30 L28 44 L40 50 L40 36"/>
    <path d="M52 30 L52 44 L40 50"/>
    <!-- Smaller accent cube on top, with faint fill on the top face -->
    <path d="M34 12 L42 8 L50 12 L42 16 Z" fill="url(#mj-grad)" fill-opacity="0.22"/>
    <path d="M34 12 L34 20 L42 24 L42 16"/>
    <path d="M50 12 L50 20 L42 24"/>
  </g>
</svg>
