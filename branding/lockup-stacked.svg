<?xml version="1.0" encoding="UTF-8"?>
<!--
  Stacked lockup. Mark on top, wordmark below. Use for narrow horizontal
  spaces (sidebars, vertical banners, business-card backs, mobile app
  splash). Total bounding box 160x180.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 180" width="160" height="180"
     font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="markGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#cdff45"/>
      <stop offset="100%" stop-color="#7cbe1e"/>
    </linearGradient>
  </defs>

  <!-- Mark centred horizontally, 80x80 -->
  <g transform="translate(40 10) scale(2)">
    <path d="M10 14 L20 9 L30 14 L30 26 L20 31 L10 26 Z"
          fill="url(#markGrad)" opacity="0.16"/>
    <path d="M10 14 L20 9 L30 14 L30 26 L20 31 L10 26 Z M10 14 L20 19 L30 14 M20 19 L20 31"
          stroke="url(#markGrad)" stroke-width="2" fill="none"
          stroke-linejoin="round" stroke-linecap="round"/>
  </g>

  <!-- Wordmark centred below the mark -->
  <text x="80" y="125" font-size="22" font-weight="700" fill="#eef0f5"
        letter-spacing="-0.5" text-anchor="middle">Block<tspan font-weight="400">Builder</tspan></text>
  <text x="80" y="148" font-size="10" font-weight="600" fill="#aab2c4"
        letter-spacing="0.22em" text-anchor="middle"
        font-family="ui-monospace, 'JetBrains Mono', monospace">STUDIO</text>
</svg>
