<?xml version="1.0" encoding="UTF-8"?>
<!--
  BlockBuilder Studio brand mark, primary colour variant.
  3 staggered isometric cubes with a small accent cube on top, lime
  gradient stroke on transparent background. Use on dark surfaces.
  For app icon / squircle backgrounds use build/icon-source.svg.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="markGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#cdff45"/>
      <stop offset="100%" stop-color="#7cbe1e"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="url(#markGrad)" stroke-width="1.6"
     stroke-linejoin="round" stroke-linecap="round">
    <path d="M14 22 L26 16 L38 22 L26 28 Z"/>
    <path d="M14 22 L14 36 L26 42 L26 28"/>
    <path d="M38 22 L38 36 L26 42"/>
    <path d="M28 30 L40 24 L52 30 L40 36 Z"/>
    <path d="M28 30 L28 44 L40 50 L40 36"/>
    <path d="M52 30 L52 44 L40 50"/>
    <path d="M34 12 L42 8 L50 12 L42 16 Z" fill="url(#markGrad)" fill-opacity="0.22"/>
    <path d="M34 12 L34 20 L42 24 L42 16"/>
    <path d="M50 12 L50 20 L42 24"/>
  </g>
</svg>
