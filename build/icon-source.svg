<?xml version="1.0" encoding="UTF-8"?>
<!--
  Master icon for BlockBuilder Studio. 1024x1024 source, exports to:
    icon.png  (Linux + AppImage, 512x512 recommended)
    icon.ico  (Windows installer + .exe, multi-resolution 16 32 48 64 128 256)
    icon.icns (macOS bundle, 16 32 64 128 256 512 1024)

  See build/README-icons.md for the conversion commands.
  Mark geometry is the same as branding/mark-marjers.svg, scaled into the
  centre of a dark squircle with a faint lime glow.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14171d"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>
    <linearGradient id="markGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cdff45"/>
      <stop offset="100%" stop-color="#7cbe1e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#cdff45" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#cdff45" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Squircle background with bevel + lime glow -->
  <rect x="0" y="0" width="1024" height="1024" rx="220" ry="220" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="220" ry="220" fill="url(#glow)"/>

  <!-- Mark: marjers staggered cubes in 64-unit viewBox, scaled and centred.
       64*14 = 896, leaves 64px padding each side. -->
  <g transform="translate(64 64) scale(14)"
     fill="none" stroke="url(#markGrad)" stroke-width="1.6"
     stroke-linejoin="round" stroke-linecap="round">
    <path d="M14 22 L26 16 L38 22 L26 28 Z"/>
    <path d="M14 22 L14 36 L26 42 L26 28"/>
    <path d="M38 22 L38 36 L26 42"/>
    <path d="M28 30 L40 24 L52 30 L40 36 Z"/>
    <path d="M28 30 L28 44 L40 50 L40 36"/>
    <path d="M52 30 L52 44 L40 50"/>
    <path d="M34 12 L42 8 L50 12 L42 16 Z" fill="url(#markGrad)" fill-opacity="0.22"/>
    <path d="M34 12 L34 20 L42 24 L42 16"/>
    <path d="M50 12 L50 20 L42 24"/>
  </g>
</svg>
