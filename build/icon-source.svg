<?xml version="1.0" encoding="UTF-8"?>
<!--
  Master icon for BlockBuilder Studio. 1024x1024 master, exports to:
    icon.png  (Linux + AppImage, 512x512 recommended)
    icon.ico  (Windows installer + .exe, multi-resolution 16 32 48 64 128 256)
    icon.icns (macOS bundle, 16 32 64 128 256 512 1024)

  See build/README-icons.md for the conversion commands.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14171d"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>
    <linearGradient id="markGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cdff45"/>
      <stop offset="100%" stop-color="#7cbe1e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#cdff45" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#cdff45" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Squircle background with subtle bevel -->
  <rect x="0" y="0" width="1024" height="1024" rx="220" ry="220" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="220" ry="220" fill="url(#glow)"/>

  <!-- Cube wireframe — same geometry as the brand mark, scaled up -->
  <g transform="translate(512 512) scale(20) translate(-20 -20)">
    <!-- Cube outline -->
    <path d="M10 14 L20 9 L30 14 L30 26 L20 31 L10 26 Z"
          fill="url(#markGrad)" opacity="0.22"/>
    <path d="M10 14 L20 9 L30 14 L30 26 L20 31 L10 26 Z M10 14 L20 19 L30 14 M20 19 L20 31"
          stroke="url(#markGrad)" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
</svg>
