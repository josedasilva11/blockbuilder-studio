<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#11141b"/>
      <stop offset="100%" stop-color="#0a0c10"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cdff45"/>
      <stop offset="100%" stop-color="#7cbe1e"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="50%" r="42%">
      <stop offset="0%" stop-color="#cdff45" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#cdff45" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 L0 40" fill="none" stroke="#1c2030" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Base + glow -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.5"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Brand mark + name (top left) -->
  <g transform="translate(72 80)">
    <svg width="40" height="40" viewBox="0 0 40 40">
      <path d="M10 14 L20 9 L30 14 L30 26 L20 31 L10 26 Z" fill="url(#lime)" opacity="0.20"/>
      <path d="M10 14 L20 9 L30 14 L30 26 L20 31 L10 26 Z M10 14 L20 19 L30 14 M20 19 L20 31"
            stroke="url(#lime)" stroke-width="2" fill="none" stroke-linejoin="round"/>
    </svg>
    <text x="54" y="20" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="700" fill="#eef0f5">Block<tspan font-weight="500">Builder</tspan></text>
    <rect x="54" y="26" width="55" height="14" rx="3" fill="rgba(196,240,79,0.12)"/>
    <text x="60" y="36" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="700" letter-spacing="2" fill="#c4f04f">STUDIO</text>
  </g>

  <!-- Version pill -->
  <g transform="translate(72 152)">
    <rect width="92" height="26" rx="13" fill="rgba(196,240,79,0.10)" stroke="rgba(196,240,79,0.22)"/>
    <text x="46" y="17" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="11" font-weight="600" fill="#c4f04f">v0.5.0</text>
  </g>

  <!-- Big headline (Inter sans + Instrument Serif italic accent) -->
  <g transform="translate(72 290)">
    <text x="0" y="0" font-family="Inter, system-ui, sans-serif" font-size="72" font-weight="800" fill="#eef0f5" letter-spacing="-2">Model in</text>
    <text x="0" y="92" font-family="Instrument Serif, Georgia, serif" font-style="italic" font-size="96" font-weight="500" fill="#c4f04f">minutes.</text>
    <text x="0" y="190" font-family="Inter, system-ui, sans-serif" font-size="72" font-weight="800" fill="#eef0f5" letter-spacing="-2">Print the same day.</text>
  </g>

  <!-- Sub-line at the bottom -->
  <g transform="translate(72 540)">
    <text font-family="Inter, system-ui, sans-serif" font-size="19" fill="#aab2c4">
      Offline desktop 3D editor ·
      <tspan fill="#c4f04f" font-weight="600">free</tspan>
      personal use · €12 commercial
    </text>
    <text x="0" y="28" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#6b7388">
      blockbuilder.studio · by
      <tspan fill="#aab2c4" font-weight="600">Marjers</tspan>
    </text>
  </g>

  <!-- Hero voxel cube on the right -->
  <g transform="translate(870 200)">
    <!-- isometric block stack -->
    <g opacity="0.95">
      <!-- bottom big block -->
      <path d="M0 120 L120 60 L240 120 L240 240 L120 300 L0 240 Z" fill="#161a23" stroke="url(#lime)" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M0 120 L120 180 L240 120" fill="none" stroke="url(#lime)" stroke-width="1.5" opacity="0.6"/>
      <path d="M120 180 L120 300" fill="none" stroke="url(#lime)" stroke-width="1.5" opacity="0.6"/>

      <!-- top smaller block (lime) -->
      <path d="M50 80 L130 40 L210 80 L210 130 L130 170 L50 130 Z" fill="rgba(196,240,79,0.12)" stroke="url(#lime)" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M50 80 L130 120 L210 80" fill="none" stroke="url(#lime)" stroke-width="1.5" opacity="0.7"/>
      <path d="M130 120 L130 170" fill="none" stroke="url(#lime)" stroke-width="1.5" opacity="0.7"/>

      <!-- floating dot (warm) -->
      <circle cx="-20" cy="50" r="5" fill="#f0a624"/>
      <circle cx="-20" cy="50" r="14" fill="none" stroke="#f0a624" stroke-width="0.8" opacity="0.4"/>

      <!-- floating dot (plum) -->
      <circle cx="270" cy="180" r="5" fill="#b87df0"/>
      <circle cx="270" cy="180" r="14" fill="none" stroke="#b87df0" stroke-width="0.8" opacity="0.4"/>
    </g>
  </g>

  <!-- Floating monospace chips on the right (overlay over the cube) -->
  <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="13">
    <g transform="translate(720 110)">
      <rect width="210" height="36" rx="18" fill="rgba(22,26,35,0.9)" stroke="#232838"/>
      <circle cx="22" cy="18" r="5" fill="#c4f04f"/>
      <text x="38" y="23" fill="#aab2c4">solid.union()</text>
    </g>
    <g transform="translate(820 510)">
      <rect width="230" height="36" rx="18" fill="rgba(22,26,35,0.9)" stroke="#232838"/>
      <circle cx="22" cy="18" r="5" fill="#f0a624"/>
      <text x="38" y="23" fill="#aab2c4">hole.subtract()</text>
    </g>
    <g transform="translate(1000 290)">
      <rect width="170" height="36" rx="18" fill="rgba(22,26,35,0.9)" stroke="#232838"/>
      <circle cx="22" cy="18" r="5" fill="#b87df0"/>
      <text x="38" y="23" fill="#aab2c4">export.stl</text>
    </g>
  </g>
</svg>
