<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>BlockBuilder Studio · Touch spike</title>
<meta name="description" content="Touch / Pencil input spike for the iPad version of BlockBuilder Studio." />
<meta name="theme-color" content="#0a0c10" />
<style>
  :root {
    --bg: #0a0c10;
    --panel: #161a23;
    --border: #232838;
    --text: #eef0f5;
    --text-mid: #aab2c4;
    --text-dim: #6b7388;
    --lime: #c4f04f;
    --amber: #f7c948;
  }
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    overflow: hidden;
    background: var(--bg); color: var(--text);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-touch-callout: none;
    overscroll-behavior: none;
  }

  /* Full-bleed canvas */
  #touch-canvas {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    display: block;
    touch-action: none;
  }

  /* Spike HUD — diagnostic overlay top-left */
  #touch-hud {
    position: absolute;
    top: max(12px, env(safe-area-inset-top));
    left: max(12px, env(safe-area-inset-left));
    padding: 12px 14px;
    background: rgba(22, 26, 35, 0.92);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-family: ui-monospace, 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-mid);
    min-width: 220px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 10;
  }
  #touch-hud > div { display: flex; justify-content: space-between; gap: 16px; margin-bottom: 2px; }
  .hud-k { color: var(--text-dim); text-transform: uppercase; font-size: 10px; letter-spacing: 0.08em; }
  .hud-v { color: var(--text); font-weight: 600; }
  .hud-help {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 10.5px;
    line-height: 1.5;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  /* Spike banner — bottom-center */
  #spike-banner {
    position: absolute;
    bottom: max(14px, env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%);
    padding: 8px 16px;
    background: linear-gradient(90deg, var(--amber) 0%, #f59e0b 100%);
    color: #0a0c10;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.05em;
    border-radius: 999px;
    z-index: 10;
  }
</style>
</head>
<body>

<canvas id="touch-canvas"></canvas>

<div id="touch-hud"></div>

<div id="spike-banner">TOUCH SPIKE · 3 boxes · tap / drag / pinch</div>

<!-- Three.js as ES module via import map (same as desktop index.html) -->
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>
<script type="module" src="./app/shell-touch/touch-shell.js"></script>

</body>
</html>
